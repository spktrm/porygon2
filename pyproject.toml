# The repo had no Python config at all until 2026-08-25. Two consequences it
# fixes: isort ran without `profile = black` and so did work black immediately
# undid on every lint pass (verified to round-trip, so adding the profile
# changes no file contents — it just stops the two tools fighting), and there
# was nowhere to record which lint findings are deliberate.

[tool.isort]
profile = "black"
skip_glob = ["*/protos/*"]

[tool.ruff]
# Generated protobuf/gRPC stubs, same exclusion autoflake already uses in
# scripts/lint.sh: they are regenerated by scripts/compile_protos.sh and the
# imports ruff calls unused are ones the generated code needs.
extend-exclude = ["*/protos/*"]

[tool.ruff.lint]
# Ruff's own default. E501 is deliberately NOT here — black owns line length,
# and double-enforcing it just produces findings black will not fix.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top) in these four files is LOAD-ORDER-CRITICAL, not
# sloppiness: each has something that must execute before a heavy import, and
# moving the imports up breaks the file. Suppressed rather than "fixed" — do
# not let an autofixer near them.
#
#   main.py / player_model.py  load_dotenv() must run before the jax imports
#   utils.py                   tqdm helpers sit above the jax/protos block
#   conftest.py                os.environ setup precedes `import jax.numpy`
#
# scripts/wandb_views.py has the same shape (a wandb.util shim that must run
# before importing wandb_workspaces) but ruff does not flag it, so it needs no
# entry here.
"rl/online/main.py" = ["E402"]
"rl/model/player_model.py" = ["E402"]
"rl/environment/utils.py" = ["E402"]
"tests/conftest.py" = ["E402"]
