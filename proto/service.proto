syntax = "proto3";

package servicev2;

message ClientRequest {
    oneof message_type {
        StepRequest step = 1;
        ResetRequest reset = 2;
    }
}


enum ModalityEnum {
    MODALITY_ENUM___UNSPECIFIED = 0;
    MODALITY_ENUM__MOVE = 1;
    MODALITY_ENUM__SWITCH = 2;
    MODALITY_ENUM__WILDCARD = 3;
    MODALITY_ENUM__OTHER = 4;
}

enum ActionEnum {
    ACTION_ENUM___UNSPECIFIED = 0;
    ACTION_ENUM__DEFAULT = 1;
    ACTION_ENUM__ALLY_1_TARGET = 2;
    ACTION_ENUM__ALLY_1_PASS = 3;
    ACTION_ENUM__ALLY_1_MOVE_1 = 4;
    ACTION_ENUM__ALLY_1_MOVE_2 = 5;
    ACTION_ENUM__ALLY_1_MOVE_3 = 6;
    ACTION_ENUM__ALLY_1_MOVE_4 = 7;
    ACTION_ENUM__ALLY_1_MOVE_1_WILDCARD = 8;
    ACTION_ENUM__ALLY_1_MOVE_2_WILDCARD = 9;
    ACTION_ENUM__ALLY_1_MOVE_3_WILDCARD = 10;
    ACTION_ENUM__ALLY_1_MOVE_4_WILDCARD = 11;
    ACTION_ENUM__ALLY_2_TARGET = 12;
    ACTION_ENUM__ALLY_2_PASS = 13;
    ACTION_ENUM__ALLY_2_MOVE_1 = 14;
    ACTION_ENUM__ALLY_2_MOVE_2 = 15;
    ACTION_ENUM__ALLY_2_MOVE_3 = 16;
    ACTION_ENUM__ALLY_2_MOVE_4 = 17;
    ACTION_ENUM__ALLY_2_MOVE_1_WILDCARD = 18;
    ACTION_ENUM__ALLY_2_MOVE_2_WILDCARD = 19;
    ACTION_ENUM__ALLY_2_MOVE_3_WILDCARD = 20;
    ACTION_ENUM__ALLY_2_MOVE_4_WILDCARD = 21;
    ACTION_ENUM__ENEMY_1_TARGET = 22;
    ACTION_ENUM__ENEMY_2_TARGET = 23;
    ACTION_ENUM__TARGET_AUTO = 24;
    ACTION_ENUM__TARGET_ALL = 25;
    ACTION_ENUM__TARGET_ALLY_SIDE = 26;
    ACTION_ENUM__TARGET_FOE_SIDE = 27;
    ACTION_ENUM__TARGET_ALLY_TEAM = 28;
    ACTION_ENUM__TARGET_RANDOM_NORMAL = 29;
    ACTION_ENUM__TARGET_ALL_ADJACENT = 30;
    ACTION_ENUM__TARGET_ALL_ADJACENT_FOES = 31;
    ACTION_ENUM__TARGET_ALLIES = 32;
    ACTION_ENUM__RESERVE_1_SWITCH_IN = 33;
    ACTION_ENUM__RESERVE_2_SWITCH_IN = 34;
    ACTION_ENUM__RESERVE_3_SWITCH_IN = 35;
    ACTION_ENUM__RESERVE_4_SWITCH_IN = 36;
    ACTION_ENUM__RESERVE_5_SWITCH_IN = 37;
    ACTION_ENUM__RESERVE_6_SWITCH_IN = 38;
    ACTION_ENUM__ALLY_1_SWITCH = 39;
    ACTION_ENUM__ALLY_2_SWITCH = 40;
}

// How the environment is asking us to choose. READ, not decorative: the same
// ActionMask fields name different cells of the (src, tgt) grid depending on
// it, because TEAM_PREVIEW puts the chosen mon in the SRC half while a battle
// switch puts it in the TGT half.
enum ActionRequestKind {
    ACTION_REQUEST_KIND___UNSPECIFIED = 0;
    ACTION_REQUEST_KIND__MOVE = 1;
    ACTION_REQUEST_KIND__FORCE_SWITCH = 2;
    ACTION_REQUEST_KIND__TEAM_PREVIEW = 3;
    ACTION_REQUEST_KIND__WAIT = 4;
}

// The legal-action set, shaped like the DECISION rather than like the model's
// scoring grid. The 41x41 (src, tgt) grid it replaces was a model-side artefact
// that leaked onto the wire: only ~264 of its 1681 cells are reachable in any
// format and ~9 are legal at a given step, so 211 bytes carried a ~10-element
// choice set with no field naming what could even in principle be set.
//
// Bit indices are positions in the ActionEnum-derived slot lists both sides
// build (rl/environment/data.py MOVE_INDICES / TARGET_SLOT_INDICES /
// RESERVE_ENTITY_INDICES; service/src/server/data.ts the same three), NOT raw
// enum values -- so the lists are the shared contract and are asserted equal
// in both test suites.
message ActionMask {
    ActionRequestKind kind = 1;

    // Bit j: RESERVE_j_SWITCH_IN is a legal switch-in (MOVE / FORCE_SWITCH) or
    // a legal lead (TEAM_PREVIEW). One field for all three because it is one
    // question -- "may this mon come in" -- and `kind` says where the grid
    // puts it.
    uint32 switch_slots = 2;

    // One entry per MOVE_INDICES slot, in that order (16 = 2 allies x 4 moves
    // x {regular, wildcard}). Bit t indexes TARGET_SLOT_INDICES: that target is
    // legal for that move slot.
    repeated uint32 move_targets = 3 [packed = true];

    // Bit s over TARGET_SLOT_INDICES: slot s is legal as a standalone action,
    // written on the grid diagonal (s, s). Today that is ALLY_i_PASS only.
    uint32 other_srcs = 4;

    // Which ally half this sub-decision is for -- 0 in singles, 0 or 1 in
    // doubles, where the service asks one slot at a time. READ: `switch_slots`
    // says WHICH mon may come in but not which active it replaces, so without
    // this the grid would legalise ALLY_2_SWITCH in a singles battle and the
    // model could pick a cell the decoder has no choice string for. Before
    // 2026-08-29 the packed grid carried it implicitly, in which ally half
    // happened to be lit.
    int32 active_slot = 5;
}

message Action {
    ActionEnum src = 1;
    ActionEnum tgt = 2;
}

message StepRequest {
    string username = 1;
    Action action = 2;
    int32 rqid = 3;
    bool teampreview = 4;
}

message ResetRequest {
    string username = 1;
    string smogon_format = 2;
    string game_id = 3;
    repeated int32 packed_teams = 4;
}

message EnvironmentState {
    bytes info = 1;

    // DEPRECATED UNTIL THE REPLAY SHARDS ARE REBUILT. The 1681-bit packed grid
    // the service no longer writes -- `structured_action_mask` below replaced
    // it 2026-08-29. It stays declared because replays/shards holds 8.8GB of
    // serialised EnvironmentState that rl/offline/dataset.py still reads
    // through process_state, and dropping the field would strand them.
    // get_action_mask prefers the structured field and falls back to this.
    // Delete both this and the fallback when those shards are next rebuilt.
    bytes packed_action_mask = 2;
    bytes history_entity_public_cache = 3;
    bytes history_entity_revealed_cache = 4;
    bytes history_entity_edge_cache = 5;
    bytes history_field = 6;
    int32 history_length = 7;
    bytes my_moveset = 8;
    bytes opp_moveset = 9;
    bytes public_team = 10;
    bytes revealed_team = 11;
    bytes private_team = 12;
    bytes field = 13;
    int32 rqid = 14;
    int32 history_packed_length = 15;
    ActionMask structured_action_mask = 16;
}

message EnvironmentTrajectory {
    repeated EnvironmentState states = 1;
}

message EnvironmentBatch {
    repeated EnvironmentTrajectory trajectories = 1;
    int32 max_trajectory_length = 2;
}

message EnvironmentResponse {
    string username = 1;
    EnvironmentState state = 2;
}

message ErrorResponse {
    string trace = 1;
}

message WorkerRequest {
    int32 task_id = 1;
    oneof request {
        StepRequest step_request = 2;
        ResetRequest reset_request = 3;
    }
}

message WorkerResponse {
    int32 task_id = 1;
    EnvironmentResponse environment_response = 2; 
    ErrorResponse error_response = 3; 
}
