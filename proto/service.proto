syntax = "proto3";

package servicev2;

message ClientRequest {
    oneof message_type {
        StepRequest step = 1;
        ResetRequest reset = 2;
    }
}


enum ModalityEnum {
    MODALITY_ENUM___UNSPECIFIED = 0;
    MODALITY_ENUM__MOVE = 1;
    MODALITY_ENUM__SWITCH = 2;
    MODALITY_ENUM__WILDCARD = 3;
    MODALITY_ENUM__OTHER = 4;
}

// The three slot vocabularies the action space is built from (replacing
// ActionEnum, 2026-09-11, whose 41 values mixed all three with two
// ALLY_i_SWITCH pseudo-slots no row or cell ever named). Both sides list
// each enum's values in ascending order, and a slot's POSITION in that
// list is its bit in ActionMask and its row in the model's readout -- see
// ActionMask below. rl/environment/data.py and service/src/server/data.ts
// build the same three lists from these, and both suites assert them.

// The 16 move sources: 2 allies x {regular, wildcard} x 4 moves. Zero is
// protolint's sentinel and is not a slot.
enum MoveSlot {
    MOVE_SLOT___UNSPECIFIED = 0;
    MOVE_SLOT__ALLY_1_MOVE_1 = 1;
    MOVE_SLOT__ALLY_1_MOVE_2 = 2;
    MOVE_SLOT__ALLY_1_MOVE_3 = 3;
    MOVE_SLOT__ALLY_1_MOVE_4 = 4;
    MOVE_SLOT__ALLY_1_MOVE_1_WILDCARD = 5;
    MOVE_SLOT__ALLY_1_MOVE_2_WILDCARD = 6;
    MOVE_SLOT__ALLY_1_MOVE_3_WILDCARD = 7;
    MOVE_SLOT__ALLY_1_MOVE_4_WILDCARD = 8;
    MOVE_SLOT__ALLY_2_MOVE_1 = 9;
    MOVE_SLOT__ALLY_2_MOVE_2 = 10;
    MOVE_SLOT__ALLY_2_MOVE_3 = 11;
    MOVE_SLOT__ALLY_2_MOVE_4 = 12;
    MOVE_SLOT__ALLY_2_MOVE_1_WILDCARD = 13;
    MOVE_SLOT__ALLY_2_MOVE_2_WILDCARD = 14;
    MOVE_SLOT__ALLY_2_MOVE_3_WILDCARD = 15;
    MOVE_SLOT__ALLY_2_MOVE_4_WILDCARD = 16;
}

// The 6 team members a switch or a lead can bring in. Zero is protolint's
// sentinel and is not a slot.
enum ReserveSlot {
    RESERVE_SLOT___UNSPECIFIED = 0;
    RESERVE_SLOT__RESERVE_1 = 1;
    RESERVE_SLOT__RESERVE_2 = 2;
    RESERVE_SLOT__RESERVE_3 = 3;
    RESERVE_SLOT__RESERVE_4 = 4;
    RESERVE_SLOT__RESERVE_5 = 5;
    RESERVE_SLOT__RESERVE_6 = 6;
}

// The 17 target slots, every value INCLUDING zero: a move is aimed at one,
// and a standalone action (a pass) is one. Zero and DEFAULT are never
// legal -- DEFAULT only names a request that carried no choice -- and are
// kept as slots until a separate commit deletes them, so that this
// vocabulary change moved no number.
enum TargetSlot {
    TARGET_SLOT___UNSPECIFIED = 0;
    TARGET_SLOT__DEFAULT = 1;
    TARGET_SLOT__ALLY_1 = 2;
    TARGET_SLOT__ALLY_1_PASS = 3;
    TARGET_SLOT__ALLY_2 = 4;
    TARGET_SLOT__ALLY_2_PASS = 5;
    TARGET_SLOT__ENEMY_1 = 6;
    TARGET_SLOT__ENEMY_2 = 7;
    TARGET_SLOT__AUTO = 8;
    TARGET_SLOT__ALL = 9;
    TARGET_SLOT__ALLY_SIDE = 10;
    TARGET_SLOT__FOE_SIDE = 11;
    TARGET_SLOT__ALLY_TEAM = 12;
    TARGET_SLOT__RANDOM_NORMAL = 13;
    TARGET_SLOT__ALL_ADJACENT = 14;
    TARGET_SLOT__ALL_ADJACENT_FOES = 15;
    TARGET_SLOT__ALLIES = 16;
}

// How the environment is asking us to choose. READ, not decorative: the
// switch block means a different Showdown choice depending on it -- a lead at
// TEAM_PREVIEW, a `switch` otherwise -- and WAIT/UNSPECIFIED light every cell
// so masked averages never meet an empty row.
enum ActionRequestKind {
    ACTION_REQUEST_KIND___UNSPECIFIED = 0;
    ACTION_REQUEST_KIND__MOVE = 1;
    ACTION_REQUEST_KIND__FORCE_SWITCH = 2;
    ACTION_REQUEST_KIND__TEAM_PREVIEW = 3;
    ACTION_REQUEST_KIND__WAIT = 4;
}

// The legal-action set, shaped like the DECISION. The 41x41 (src, tgt) grid
// it replaced (2026-08-29) was a model-side artefact that leaked onto the
// wire: only ~264 of its 1681 cells were reachable in any format and ~9 legal
// at a given step. Since 2026-08-31 this message's fields, flattened in field
// order, ARE the model's action space -- see `Action` below.
//
// Bit indices are positions in the MoveSlot / ReserveSlot / TargetSlot value
// lists both sides build (rl/environment/data.py MOVE_INDICES /
// RESERVE_ENTITY_INDICES / TARGET_SLOT_INDICES; service/src/server/data.ts the
// same three) -- so the lists are the shared contract and are asserted equal
// in both test suites.
message ActionMask {
    ActionRequestKind kind = 1;

    // Bit j: RESERVE_j_SWITCH_IN is a legal switch-in (MOVE / FORCE_SWITCH) or
    // a legal lead (TEAM_PREVIEW). One field for all three because it is one
    // question -- "may this mon come in" -- and `kind` says which choice
    // string it decodes to.
    uint32 switch_slots = 2;

    // One entry per MOVE_INDICES slot, in that order (16 = 2 allies x 4 moves
    // x {regular, wildcard}). Bit t indexes TARGET_SLOT_INDICES: that target is
    // legal for that move slot.
    repeated uint32 move_targets = 3 [packed = true];

    // Bit s over TARGET_SLOT_INDICES: slot s is legal as a standalone action.
    // Today that is ALLY_i_PASS only.
    uint32 other_srcs = 4;

    // Which ally half this sub-decision is for -- 0 in singles, 0 or 1 in
    // doubles, where the service asks one slot at a time. READ: `switch_slots`
    // says WHICH mon may come in but not which active it replaces; the decoder
    // needs this to build the choice string. Before 2026-08-29 the packed grid
    // carried it implicitly, in which ally half happened to be lit.
    int32 active_slot = 5;
}

// The chosen action, as an index into the BLOCK SPACE -- the flattening of
// ActionMask's own fields, in field order:
//
//   [0, 6)     switch     bit j of `switch_slots` (RESERVE_j comes in / leads)
//   [6, 278)   move       move_targets, row-major: slot m of MOVE_INDICES x
//                         bit t of TARGET_SLOT_INDICES, cell 6 + 17*m + t
//   [278, 295) standalone bit s of `other_srcs`
//
// This layout is the shared contract between the service's cell->choice map
// and the model's readout; both sides derive the offsets from the same three
// slot-list lengths (rl/environment/data.py and service/src/server/data.ts)
// and assert the 295 total. It replaced Action{src, tgt} -- an index pair
// into the 41x41 scoring grid -- when the grid was retired (2026-08-31):
// `kind` + `active_slot` on the mask carry what the two halves used to.
message Action {
    int32 cell = 1;
}

message StepRequest {
    string username = 1;
    Action action = 2;
    int32 rqid = 3;
    bool teampreview = 4;
}

message ResetRequest {
    string username = 1;
    string smogon_format = 2;
    string game_id = 3;
    repeated int32 packed_teams = 4;
}

message EnvironmentState {
    bytes info = 1;

    // Field 2 was the 1681-bit packed ActionEnum grid, retired 2026-08-29; its
    // replay-shard fallback went with ActionEnum (2026-09-11). Never reuse it.
    reserved 2;
    bytes history_entity_public_cache = 3;
    bytes history_entity_revealed_cache = 4;
    bytes history_entity_edge_cache = 5;
    bytes history_field = 6;
    int32 history_length = 7;
    bytes my_moveset = 8;
    bytes opp_moveset = 9;
    bytes public_team = 10;
    bytes revealed_team = 11;
    bytes private_team = 12;
    bytes field = 13;
    int32 rqid = 14;
    int32 history_packed_length = 15;
    ActionMask structured_action_mask = 16;
    // The OPPONENT's last request, serialised through the same
    // EntityPrivateNodeFeature rows as `private_team` -- the centralised-value
    // truth channel (2026-09-01). Written only in training self-play (the
    // builder reads `player.opponent`); empty at deploy, for baselines'
    // observers and for spectator exports, and the decode zero-fills so old
    // shards keep parsing. NEVER reachable by the policy: the model routes
    // these rows into a leak-masked trunk partition read only by the
    // privileged value head. Field 16 above RE-USED the deleted
    // opp_private_team's number, so this channel takes 17 -- never reuse a
    // freed number here.
    bytes opp_private_team = 17;
    // How many times a PAST history row has been rewritten in place this
    // game (2026-09-02) -- incremented by `EdgeBuffer.remapEntitySlot`, the
    // one writer of already-serialised rows (an Illusion |replace| moves the
    // disguised period's edges onto the true pokemon's slot). Monotone
    // non-decreasing within a game. An actor carrying history state across
    // requests recomputes from scratch when this moves; every other
    // consumer ignores it. Not a model input.
    int32 history_rewrite_count = 18;
}

message EnvironmentTrajectory {
    repeated EnvironmentState states = 1;
}

message EnvironmentBatch {
    repeated EnvironmentTrajectory trajectories = 1;
    int32 max_trajectory_length = 2;
}

message EnvironmentResponse {
    string username = 1;
    EnvironmentState state = 2;
}

message ErrorResponse {
    string trace = 1;
}

message WorkerRequest {
    int32 task_id = 1;
    oneof request {
        StepRequest step_request = 2;
        ResetRequest reset_request = 3;
    }
}

message WorkerResponse {
    int32 task_id = 1;
    EnvironmentResponse environment_response = 2; 
    ErrorResponse error_response = 3; 
}
